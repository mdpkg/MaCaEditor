name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:architecture
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: npm run build

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

  rust-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Verify the patched glib is selected
        run: |
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --filter-platform x86_64-unknown-linux-gnu --format-version 1 > /tmp/maca-cargo-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          packages = json.load(open('/tmp/maca-cargo-metadata.json'))['packages']
          glib = [package for package in packages if package['name'] == 'glib']
          expected = Path('src-tauri/vendor/glib/Cargo.toml').resolve()
          assert len(glib) == 1, glib
          assert glib[0]['source'] is None, glib[0]
          assert Path(glib[0]['manifest_path']).resolve() == expected, glib[0]
          PY
      - name: Test the glib security backport with optimizations
        run: cargo test --manifest-path src-tauri/vendor/glib/Cargo.toml --release --lib variant_iter
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
