<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<polygon points="0 0, 10 3, 0 6" fill="#000000" />
</marker>
</defs>
<rect x="100" y="100" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="1" /><text x="180" y="130" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">Web Client</text>
<rect x="100" y="300" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="1" /><text x="180" y="330" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">API Server</text>
<rect x="100" y="500" width="160" height="60" fill="#ffffff" stroke="#000000" stroke-width="1" /><text x="180" y="530" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">Database</text>
<line x1="260" y1="130" x2="100" y2="330" stroke="#000000" stroke-width="1" marker-end="url(#arrowhead)" />
