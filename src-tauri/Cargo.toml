[package]
name = "maca-editor"
version = "1.0.0"
description = "MaCa Editor - Markdown Package editor"
authors = ["MaCa Editor"]
edition = "2021"

[lib]
name = "maca_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate", "deflate-flate2"] }
thiserror = "2"
