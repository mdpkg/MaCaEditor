[package]
name = "maca-editor"
version = "2.0.0"
description = "MaCa Editor - Markdown Package editor"
authors = ["MaCa Editor"]
edition = "2021"

[lib]
name = "maca_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate", "deflate-flate2"] }
thiserror = "2"
notify = "8.2"
async-openai = { version = "0.41", default-features = false, features = ["rustls", "chat-completion", "model", "middleware"] }
eventsource-stream = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_Threading",
] }
